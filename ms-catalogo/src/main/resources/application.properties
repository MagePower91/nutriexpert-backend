spring.application.name=ms-catalogo
server.port=8081

# H2 en archivo: los datos sobreviven a un reinicio (carpeta ./data junto al .jar)
spring.datasource.url=jdbc:h2:file:./data/catalogo
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# data.sql se ejecuta despues de que Hibernate crea las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Consola H2 en http://localhost:8081/h2-console (JDBC URL: jdbc:h2:file:./data/catalogo)
spring.h2.console.enabled=true
