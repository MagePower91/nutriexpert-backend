spring.application.name=ms-registros
server.port=8082

spring.datasource.url=jdbc:h2:file:./data/registros
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# ms-catalogo para validar que el cultivo exista. En EC2 corren en la misma maquina.
catalogo.url=${CATALOGO_URL:http://localhost:8081}
catalogo.validar=true
